<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atölye</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c96442'/%3E%3Cpath d='M9 22l7-13 7 13M12 17h8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/vendor/marked/marked.umd.js"></script>
  <script src="/vendor/dompurify/purify.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M9 22l7-13 7 13M12 17h8"/></svg>
        </span>
        <span class="brand-name">Atölye</span>
        <button class="icon-btn" id="themeBtn" title="Tema değiştir" aria-label="Tema değiştir">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>

      <button class="new-btn" id="newSessionBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Yeni oturum
      </button>

      <div class="section-label">
        <span>Projeler</span>
        <button class="add-project" id="folderBtn" title="Proje klasörü ekle">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></svg>
          Klasör ekle
        </button>
      </div>
      <nav class="session-list" id="sessionList" aria-label="Projeler ve oturumlar"></nav>

      <div class="sidebar-foot" id="gatewayInfo"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Menü">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="topbar-title">
          <div class="title" id="sessionTitle">Yeni oturum</div>
          <div class="subtitle" id="sessionCwd"></div>
        </div>
        <div class="conn" id="connState" title="Bağlantı durumu"><span class="dot"></span><span class="label">Bağlanıyor</span></div>
      </header>

      <section class="transcript" id="transcript" aria-live="polite">
        <div class="empty" id="emptyState">
          <div class="empty-logo"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M9 22l7-13 7 13M12 17h8"/></svg></div>
          <h1>Ne üzerinde çalışalım?</h1>
          <p>Kodunuzu okuyabilir, düzenleyebilir ve komut çalıştırabilirim. Değişiklik yapmadan önce izninizi isterim.</p>
          <div class="suggestions">
            <button data-prompt="Bu projenin yapısını incele ve kısaca özetle.">Projeyi özetle</button>
            <button data-prompt="Projedeki testleri çalıştır ve hata varsa düzelt.">Testleri çalıştır</button>
            <button data-prompt="Son değişiklikleri incele ve olası hataları bul.">Kodu incele</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
      </section>

      <footer class="composer-wrap">
        <div class="popup" id="popup" hidden></div>
        <div class="composer" id="composer">
          <div class="attachments" id="attachments"></div>
          <textarea id="input" rows="1" placeholder="Bir şey sorun ya da görev verin…  ( / komutlar, @ dosyalar )" autocomplete="off"></textarea>
          <div class="composer-bar">
            <div class="left">
              <button class="icon-btn" id="attachBtn" title="Görsel ekle" aria-label="Görsel ekle">
                <svg viewBox="0 0 24 24"><path d="M21.4 11.1l-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8l8.5-8.5a3.7 3.7 0 0 1 5.2 5.2l-8.5 8.5a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
              </button>
              <input type="file" id="fileInput" accept="image/*" multiple hidden>
              <div class="select-wrap" title="İzin modu (Shift+Tab)">
                <select id="modeSelect" aria-label="İzin modu">
                  <option value="default">Her işlemde sor</option>
                  <option value="acceptEdits">Düzenlemeleri kabul et</option>
                  <option value="plan">Plan modu</option>
                  <option value="bypassPermissions">İzinleri atla</option>
                </select>
              </div>
              <div class="select-wrap" title="Model">
                <select id="modelSelect" aria-label="Model">
                  <option value="">Varsayılan model</option>
                </select>
              </div>
            </div>
            <div class="right">
              <span class="hint" id="hint">Enter gönder · Shift+Enter yeni satır</span>
              <button class="send-btn" id="sendBtn" aria-label="Gönder" title="Gönder">
                <svg class="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                <svg class="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="statusline" id="statusline"></div>
      </footer>
    </main>
  </div>

  <dialog id="folderDialog" class="dialog">
    <form method="dialog" class="dialog-inner">
      <div class="dialog-head">
        <h2>Proje klasörü ekle</h2>
        <button class="icon-btn" value="cancel" aria-label="Kapat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="path-row">
        <input id="pathInput" type="text" spellcheck="false" aria-label="Klasör yolu">
        <button type="button" class="btn" id="pathGo">Git</button>
      </div>
      <div class="dir-list" id="dirList"></div>
      <div class="dialog-foot">
        <button class="btn ghost" value="cancel">Vazgeç</button>
        <button class="btn primary" id="folderChoose" value="ok">Ekle ve yeni oturum aç</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
